env_type: maniskill
wrap_obs_mode: simple
total_num_envs: null
reward_mode: raw

auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 80
max_episode_steps: 80 # max episode steps for truncation

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

init_params:
  id: StackCube-v1
  task_description: "stack the red cube on top of the green cube"
  num_envs: null # will be set in ManiSkillEnv init
  obs_mode: "rgb"
  control_mode: pd_ee_delta_pose
  sim_backend: "gpu"
  sim_config:
    sim_freq: 500
    control_freq: 5
  max_episode_steps: ${env.train.max_episode_steps} # max episode steps for truncation
  sensor_configs:
    shader_pack: "default"
  render_mode: all
